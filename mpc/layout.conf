# Acid3 page for MPC OS (mpc-vst-plugins layout syntax). Panel order follows the classic bass line layout.
theme_accent=d8452b
theme_accent_hi=f06a3c
theme_knob_dot=d8452b
[tab ACID3]
frame x=10 y=92 w=1258 h=330 title="VOICE"
knob cx=88 cy=250 r=46 label="TUNING" key=tune look=chrome
knob cx=245 cy=250 r=46 label="CUT OFF" key=cutoff look=chrome
knob cx=402 cy=250 r=46 label="RESONANCE" key=reso look=chrome
knob cx=559 cy=250 r=46 label="ENV MOD" key=envmod look=chrome
knob cx=716 cy=250 r=46 label="DECAY" key=decay look=chrome
knob cx=873 cy=250 r=46 label="ACCENT" key=accent look=chrome
enum_v cx=1030 cy=230 label="WAVEFORM" key=wave options="SAW,SQUARE"
knob cx=1187 cy=250 r=46 label="VOLUME" key=volume look=chrome
frame x=10 y=432 w=1258 h=276 title="SEQUENCER  (FOLLOWS MPC PLAY)"
toggle cx=88 cy=566 label="SEQ" key=seq
popup cx=300 cy=576 w=240 h=48 label="PATTERN" key=pattern
knob cx=516 cy=566 r=38 label="TRANSPOSE" key=transpose
knob cx=673 cy=566 r=38 label="SWING" key=swing
knob cx=830 cy=566 r=38 label="ACCENT VEL" key=accthr
toggle cx=1030 cy=566 label="DRIFT" key=drift
qlinks "ACID3" = cutoff,reso,envmod,decay,accent,wave,tune,volume,seq,pattern,transpose,swing,accthr,drift
